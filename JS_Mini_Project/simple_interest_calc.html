<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" onsubmit="return false">
 
        <table border="1"  celpadding="10" cellspacing="0">
            <tr>
                <td>Amount</td>
                <td><input type="number"  id="amount"></td>
            </tr>

            <tr>
                <td>Rate</td>
                <td><input type="number" id="rate"></td>

            </tr>

            <tr>
                <td>Time</td>
                <td><input type="number" id="time"></td>
            </tr>

            <tr>
                <td>Simple interest</td>
                <td><input type="number" name="" id="si"></td>
            </tr>

            <tr>
                <td></td>
                <td><button onclick="calc()">Calculate</button></td>
            </tr>
        </table>

    </form>


    <script>
        function calc(){
            var a=Number(document.getElementById("amount").value)
            var b= Number(document.getElementById("rate").value)
            var c= Number( document.getElementById("time").value)
            var d= document.getElementById("si")

            var result=Number((a*b*c)/100)
            console.log(result);

            d.value=result
        }
    </script>
</body>
</html>
