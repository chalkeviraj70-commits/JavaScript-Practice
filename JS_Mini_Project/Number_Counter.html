<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        
       .main{
        height: 120px;
        width: 120px;
        border: 1px solid red;
        display: flex;
        align-items: center;
        justify-content: center;

       }
    </style>
</head>
<body>
    <div class="main">
        <h1 id="heading"></h1>
    </div>
    <button onclick="start()">Start</button>
    <button onclick="stop()">Stop</button>
    <button  onclick="reset()">Reset</button>


    <script>
        let a=document.getElementById("heading")
        // let  b=setInterval(start,2000)
        let x=0
        let inner

        function change(){
            x=x+1
            a.value=a.innerText=x
        }
        function start(){
            inner=setInterval(change,1000) 
            // x=x+1
            // a.value=a.innerText=x
            // console.log(x);

            
           

        }
        //  clearInterval(b)

         function stop(){
            //  b=setInterval(start,2000)
            clearInterval(inner)
         }

         function reset(){
            a.value=a.innerText=0
            x=0
         }
           
    </script>
</body>
</html>
