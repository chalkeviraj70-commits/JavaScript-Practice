</form>


    <script>
        function calc(){
              var total=document.getElementById("total")
              var a=Number ( document.getElementById("t1").value)
              var b=Number( document.getElementById("t2").value)
              var c=Number ( document.getElementById("t3").value)
              var d=Number( document.getElementById("t4").value)
              var e=Number( document.getElementById("t5").value)
              var f=Number( document.getElementById("t6").value)
              
              total.value = Number(a+b+c+d+e+f)
            //   console.log(total);
              

             
            var marks=total.value
            var Percentage=document.getElementById("perc")
             var result= ((marks/600)*100).toFixed(2)
             Percentage.value=result
             
            //  return Percentage
            // return total

            var grade
            

            if(result >=90)
        {
            grade="A+"
        }

        else if(result >=80)
        {
            grade="A"
        }

        else if(result >=70)
        {
            grade="B+"
        }

        else if(result  >=60)
        {
            grade="B"
        }

        else if( result >=50)
        {
            grade="C"
        }

        else if(result >=35)
        {
            grade="D"
        }

        else{
            grade="Fail"
        }
        
        document.getElementById("gd").value=grade



        }
